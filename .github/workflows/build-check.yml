name: Build check

# extension.js is NOT committed (it's the generated bundle; CI builds it into the
# release .zip — see release.yml). These jobs guard the SOURCE: one builds the
# bundle from src/ and fails if the build breaks or the output isn't valid JS,
# the other compiles and tests the native sidecar.
#
# The sidecar job exists because release.yml was the only thing that ever ran
# `cargo`, so a `sidecar-src/` change that did not compile stayed green until
# somebody pushed a tag - at which point the release, not the commit, was the
# thing that broke.

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "scripts/**"
      - "sidecar-src/**"
      - "build.mjs"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "sidecar-src/**"
      - "build.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install build tooling
        run: npm ci
      - name: Build extension.js from src/
        run: node build.mjs
      - name: Syntax check the built bundle
        run: node --check extension.js
      - name: Verify language detection
        run: node scripts/verify.mjs

  sidecar:
    name: Sidecar (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sidecar-src/target
          key: sidecar-check-${{ hashFiles('sidecar-src/Cargo.lock', 'sidecar-src/Cargo.toml') }}
      - name: cargo fmt
        working-directory: sidecar-src
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: sidecar-src
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        working-directory: sidecar-src
        run: cargo test --locked
