[package]
name = "tedi-beautify-helper"
version = "0.2.0"
edition = "2021"
description = "Sidecar formatter helper for the tedi.beautify extension"
license = "Apache-2.0"
publish = false

[[bin]]
name = "tedi-beautify-helper"
path = "src/main.rs"

[dependencies]
# Infra. axum + tokio mirror the tedi.sql-explorer pattern: tiny HTTP server
# on loopback authenticated by a per-boot bearer token. ~3 MB compiled.
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "macros", "net", "time"] }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
# CORS layer. WebView2 sends a preflight OPTIONS for our POST /format
# because Content-Type: application/json + an Authorization header are
# both non-safelisted; without ACAO headers the preflight is rejected
# and `fetch()` surfaces as `TypeError: Failed to fetch`. Mirrors the
# tedi.sql-explorer setup; the bearer token remains the real auth.
tower-http = { version = "0.7", default-features = false, features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Token entropy. `getrandom` is the OS-CSPRNG shim every `rand` build already
# pulls in; calling it directly drops `rand` and its churn (thread_rng -> rng)
# from the tree for the two lines we actually need.
getrandom = "0.3"
# The error type every dprint / markup_fmt embedded-formatter callback returns.
anyhow = "1"

# JSON / JSONC / JSON5 via dprint-plugin-json (jsonc-parser under the hood -
# the same formatter Deno ships). Replaces the old serde_json round-trip,
# which silently (a) re-sorted every object key alphabetically because
# serde_json's default Map is a BTreeMap, (b) round-tripped integers through
# f64 and mangled anything past 2^53, and (c) rejected comments outright, so
# .jsonc / .json5 never actually worked.
dprint-plugin-json = "0.23"
# CSS / SCSS / LESS / Sass via g-plane's malva. Single crate, four language
# modes via the Syntax enum; comments preserved.
malva = "0.16"
# HTML / Vue / Svelte / Astro / Angular / Jinja / Vento / Mustache AND XML via
# g-plane's markup_fmt. Embedded <script> / <style> / <template lang> blocks are
# routed back through the formatters below via the external-formatter callback.
markup_fmt = "0.27"
# YAML via g-plane's pretty_yaml. Preserves comments (unlike a plain
# serde_yaml round-trip, which has no AST representation for them).
pretty_yaml = "0.6"
# TOML via toml_edit. Comment-preserving by design - that's the headline
# feature that separates it from the lossy `toml` crate.
toml_edit = "0.25"
# SQL via sqlformat. Generic dialect covers MySQL / PG / SQLite / MSSQL's
# common subset; users with dialect-specific edge cases should reach for
# a dedicated tool.
sqlformat = "0.5"
# JS / TS / JSX / TSX via dprint-plugin-typescript. Wraps swc_ecma_parser
# plus dprint's Prettier-compatible printer - same formatter VSCode ships
# via the "Prettier" extension. Adds ~10-15 MB to the release binary; the
# README's "Comparison" section calls this out so users understand the
# size budget. Its `external_formatter` hook formats css / html / sql tagged
# template literals (styled-components, lit-html) - see `embedded.rs`.
dprint-plugin-typescript = "0.96"
# Markdown via dprint-plugin-markdown. Re-flows paragraphs, normalises
# list markers, fences code blocks consistently, and hands every fenced code
# block back to us so the body is formatted in its own language.
dprint-plugin-markdown = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
# NOT `panic = "abort"`: a parser panic on a pathological file has to unwind
# into `catch_unwind` and come back as a 400, otherwise one bad buffer kills
# the whole sidecar and every later format fails until the extension is
# toggled off and on.
